 const h=categoryRecent(g.categoryId),card=g.card;
 if(!card)return;
 h.answers.push(card.wiki||card.label);
 if(card.image)h.images.push(card.source||card.image);
 h.answers=h.answers.slice(-150);h.images=h.images.slice(-300);
 try{localStorage.setItem(RECENT_KEY,JSON.stringify(recent))}catch(e){}
}
function lastPosition(a,id){return a.lastIndexOf(id)}
function pickImage(base,h){
 const variants=[{image:base.image||'',source:base.source||'',fallbackImage:base.fallbackImage||'',kind:base.kind},...(base.variants||[])].filter(x=>x.image);
 if(!variants.length)return base;
 const unique=[...new Map(variants.map(v=>[v.source||v.image,v])).values()];
 const shuffled=shuffle(unique);
 shuffled.sort((a,b)=>lastPosition(h.images,a.source||a.image)-lastPosition(h.images,b.source||b.image));
 return {...base,...shuffled[0],variants:undefined};
}

 else if(action==='mask-grow'||action==='mask-shrink'){
  const m=r.masks[r.selected];if(!m)return;
  const grow=action==='mask-grow'?8:-8;
  const cx=m.x+m.w/2,cy=m.y+m.h/2;

  m.x=Math.max(0,Math.min(100-m.w,cx-m.w/2));m.y=Math.max(0,Math.min(100-m.h,cy-m.h/2));
 }else if(action==='mask-delete'){if(r.selected<0)return;r.masks.splice(r.selected,1);r.selected=r.masks.length?Math.min(r.selected,r.masks.length-1):-1}

 }else if(action==='review-skip'){
  const key=approvedKey(r.category,card);skippedPhotos[key]=true;delete approvedPhotos[key];saveReview();r.index++;reviewLoadCard();
 }
 render(true);
}

function cleanRobloxName(raw){

const ROBLOX_PREFERRED={};
async function fetchRoblox(type,args={},timeout=6500){
 let lastError='';
 const preferred=ROBLOX_PREFERRED[type];
 const routes=preferred?[preferred,...ROBLOX_API_ROUTES[type].filter(b=>b!==preferred)]:ROBLOX_API_ROUTES[type];
 for(const base of routes||[]){
  const query=new URLSearchParams(args),local=base.startsWith('/');
  if(local){ // Fast skip on plain local files; Netlify Functions exist only on a deployed Netlify site.
   if(location.protocol==='file:')continue;
  }
  const url=base+(base.includes('?')?'&':'?')+query.toString();
  const ctl=new AbortController(),tm=setTimeout(()=>ctl.abort(),timeout);
  try{
   const r=await fetch(url,{signal:ctl.signal,headers:{accept:'application/json'}});
   if(!r.ok)throw Error('HTTP '+r.status);
   const json=await r.json();
   if(json&&typeof json==='object'&&!json.errors&&!json.error){ROBLOX_PREFERRED[type]=base;return json;}
   throw Error('Răspuns invalid');
  }catch(e){lastError=String(e?.message||e)}finally{clearTimeout(tm)}
 }
 throw Error('Serviciile Roblox nu au putut fi accesate din browser: '+lastError);
}
function extractRobloxGames(data){
 const result=[];
 for(const block of data?.searchResults||[]){
  const contents=Array.isArray(block?.contents)?block.contents:(block?.universeId?[block]:[]);
  for(const game of contents){
   const id=Number(game?.universeId||game?.universe?.id||0),name=String(game?.name||'');
   if(!Number.isSafeInteger(id)||id<=0||!name)continue;
   const label=cleanRobloxName(name);
   if(!label||label.length<3||label.length>58||/^(?:roblox|search|games|catalog|untitled|test|new game|game)$/i.test(label))continue;
   if(/(?:free robux|free admin|robux generator|\bcopy\b|\btest server\b|\buncopylocked\b)/i.test(name))continue;
   result.push({id,label,original:name,playing:Number(game?.playerCount||game?.playing||0),upvotes:Number(game?.totalUpVotes||0),visits:Number(game?.visits||0)});
  }
 }
 return result;
}

async function generateRobloxCategory(){

 goodCalls++;
 for(const game of extractRobloxGames(probe))found.set(game.id,game);
 const queryList=ROBLOX_SEARCH_SEEDS.filter(x=>x!=='roblox');
 let ptr=0;
 async function searchWorker(){
  while(ptr<queryList.length&&found.size<220){const term=queryList[ptr++];
   try{
    let token='';
    for(let page=0;page<(term==='roblox'||term==='simulator'||term==='horror'?2:1);page++){
     const data=await fetchRoblox('search',{searchQuery:term,sessionId:'duel-arena',pageType:'all',...(token?{pageToken:token}:{})});
     goodCalls++;
     for(const g of extractRobloxGames(data)){
      const prev=found.get(g.id);
      if(!prev||g.playing>prev.playing)found.set(g.id,g);
     }
     token=String(data.nextPageToken||'');if(!token)break;
    }
   }catch(e){}
  }
 }
 await Promise.all(Array.from({length:5},searchWorker));

 let games=[...found.values()].filter(g=>g.label.length>=3&&robloxNameKey(g.label).length>=3);
 // Most recognizable/popular first, but remove copies with near-identical display titles.
 games.sort((a,b)=>(b.playing-a.playing)||(b.upvotes-a.upvotes)||(b.visits-a.visits));
 const byTitle=new Map();
 for(const g of games){const key=robloxNameKey(g.label);if(!byTitle.has(key))byTitle.set(key,g)}
 games=[...byTitle.values()].slice(0,210);
 const images=new Map();
 let thumbSuccess=0;
 for(let i=0;i<games.length;i+=40){
  const chunk=games.slice(i,i+40),ids=chunk.map(g=>g.id).join(',');
  try{
   const icons=await fetchRoblox('icons',{universeIds:ids,returnPolicy:'PlaceHolder',size:'512x512',format:'Png',isCircular:'false'},8500);

    const id=Number(t.targetId),url=safeRobloxImage(t.imageUrl);

   }

 return shuffle(items).slice(0,170);
}

async function generateAutoCategory(topic){
 if(/roblox/i.test(topic))return generateRobloxCategory();
 const hint=AUTO_HINTS.find(([rx])=>rx.test(topic))?.[1];
 const term=hint?.topic||topic.trim();
 const items=[],seen=new Set();
 function put(item){const k=(item[1]||item[0]).toLocaleLowerCase('en');if(seen.has(k))return;seen.add(k);items.push(item)}
 function putPages(data){for(const p of Object.values(data.query?.pages||{}))if(acceptableAutoPage(p))put(autoItem(p))}
 // Popular Roblox games are looked up by exact Wikipedia article title; never choose a generic 'Roblox' image for a game.
 if(hint?.roblox){
  try{const w=await queryWikiImages(ROBLOX_KNOWN.map(x=>x[1]),'en');for(const [label,title] of ROBLOX_KNOWN){const p=w[title.toLowerCase()];if(p?.ns===0&&p.thumbnail?.source&&!p.missing)put([label,p.title,'🎮',null,p.thumbnail.source])}}catch(e){}
 }
 // Discover actual Wikipedia category names and verify that each resulting page is a member.
 const categories=[];
 if(hint?.category)categories.push('Category:'+hint.category);
 try{
  const result=await wikiJson({list:'search',srsearch:term,srnamespace:'14',srlimit:'12'},'en');
  const candidates=result.query?.search||[];
  const tokens=term.toLocaleLowerCase('en').split(/[^a-z0-9]+/).filter(v=>v.length>=3);
  const scored=candidates.map(p=>({title:p.title,score:tokens.reduce((n,w)=>n+(p.title.toLocaleLowerCase('en').includes(w)?1:0),0)})).filter(x=>x.score>=Math.max(1,Math.ceil(tokens.length*.65))).sort((a,b)=>b.score-a.score);
  for(const cat of scored.slice(0,3))if(!categories.includes(cat.title))categories.push(cat.title)
 }catch(e){}
 for(const category of categories.slice(0,3)){
  if(items.length>=130)break;
  try{
   const result=await wikiJson({generator:'categorymembers',gcmtitle:category,gcmtype:'page',gcmlimit:'max',prop:'pageimages|pageprops',piprop:'thumbnail',pithumbsize:'800',pilicense:'any'},'en',14000);
   putPages(result)
  }catch(e){}
 }
 // For non-Roblox topics, use article search as supplemental discovery but check the topic is mentioned
 // in each result's short Wikipedia extract; text search by itself is not evidence that the photo depicts it.
 if(items.length<35){
  try{
   const response=await wikiJson({generator:'search',gsrsearch:term,gsrnamespace:'0',gsrlimit:'50',prop:'pageimages|pageprops|extracts',exintro:'1',explaintext:'1',exchars:'600',piprop:'thumbnail',pithumbsize:'800',pilicense:'any'},'en',14000);
   const words=(hint?.roblox?['roblox']:term.toLowerCase().split(/[^a-z0-9]+/).filter(x=>x.length>3)).slice(0,4);
   for(const p of Object.values(response.query?.pages||{}))if(acceptableAutoPage(p)){
    const description=(String(p.extract||'')+' '+p.title).toLowerCase();
    if(words.length&&(!words.some(w=>description.includes(w))))continue;
    // Never bring in generic topics as answers for a Roblox game quiz.
    if(hint?.roblox&&(/^(roblox|list of)/i.test(p.title)||!description.includes('game')))continue;
    put(autoItem(p));
   }
  }catch(e){}
 }
 return shuffle(items).slice(0,140);
}

class DuelEvents {
  constructor(){this._listeners=new Map()}
  on(type,cb){if(!this._listeners.has(type))this._listeners.set(type,[]);this._listeners.get(type).push(cb);return this}
  _emit(type,...values){for(const fn of this._listeners.get(type)||[])try{fn(...values)}catch(e){console.error(e)}}
}

}
class DuelRoomPeer extends DuelEvents {

 _startSocket(code,role,conn){
  const wsUrl=`${location.protocol==='https:'?'wss:':'ws:'}//${location.host}/api/room/${encodeURIComponent(code)}?role=${role}`;
  const ws=new WebSocket(wsUrl);this._ws=ws;let started=false;

    }else if(m.relay==='new-player'&&role==='host'){
      if(this._connections.has(m.id))return;
      const p=new DuelRoomConnection(this,m.id,false);p.open=true;this._connections.set(m.id,p);this._emit('connection',p);
    }else if(m.relay==='to-host'&&role==='host'){

    }else if(m.relay==='player-left'&&role==='host'){
      const p=this._connections.get(m.id);if(p){p._disconnect();this._connections.delete(m.id)}

    }

 const masks=normalizedMasks(g.card.masks);
 if(!masks.length)masks.push({x:20,y:15,w:60,h:22});
 const m=masks[masks.length-1],cx=m.x+m.w/2,cy=m.y+m.h/2;
 m.w=Math.min(98,m.w+10);m.h=Math.min(85,m.h+7);m.x=Math.max(0,Math.min(100-m.w,cx-m.w/2));m.y=Math.max(0,Math.min(100-m.h,cy-m.h/2));
 g.card.masks=normalizedMasks(masks);persistCurrentMasks();render(true);broadcast();return;
 }
 if(action==='fix-mask-add'){
 const g=app.game;if(!app.blurAdjust||!g?.card)return;
 const masks=normalizedMasks(g.card.masks);if(masks.length>=5){notify('Maximum 5 zone pe fotografie.');return;}
 masks.push({x:22,y:35,w:56,h:19});g.card.masks=masks;persistCurrentMasks();render(true);broadcast();return;
 }
 if(action==='move-blur'){if(!app.game||!categoryNeedsManualBlur(app.game.categoryId))return;const g=app.game;if(!app.blurAdjust){app.blurAdjustWasPlaying=g.phase==='playing';if(app.blurAdjustWasPlaying)g.phase='paused';app.blurAdjust=true;render(true);broadcast();}else{app.blurAdjust=false;if(app.blurAdjustWasPlaying&&g.phase==='paused'){g.phase='playing';g.lastAt=performance.now()}app.blurAdjustWasPlaying=false;render(true);broadcast()}return}if(action==='store-blur'){if(app.game&&categoryNeedsManualBlur(app.game.categoryId)){app.game.blurExtended=!app.game.blurExtended;render(true);broadcast()}return}if(action==='review-start'){if(!app.game||app.game.phase!=='review')return;app.blurAdjust=false;app.blurAdjustWasPlaying=false;app.game.phase='countdown';app.game.countdownMs=3000;app.game.lastAt=performance.now();render(true);broadcast();return}if(action==='category'){app.selected=el.dataset.id;app.catFilter='';app.customOpen=false;app.customEdit=null;render(true);startPhotoLoad(app.selected);return}if(action==='copy-code'){copyText(app.room);return}if(action==='copy-link'){if(location.protocol==='file:'){notify('Publică site-ul pentru a avea un link de partajat. Folosește codul camerei.');return}copyText(location.origin+location.pathname+'?room='+app.room);return}if(action==='connect'){joinRoom();return}if(action==='review-approved'){openReview(app.selected,false,true);return}
  if(action==='reset-bank'){
   delete fixedPhotoBank[app.selected];
   try{localStorage.setItem(PHOTO_BANK_KEY,JSON.stringify(fixedPhotoBank))}catch(e){}
   delete app.loadState[app.selected];delete app.loadState[app.selected+'_promise'];
   startPhotoLoad(app.selected).then(()=>notify('Imaginile au fost actualizate.'));
   return;
  }
  if(action==='open-review'){
   startPhotoLoad(app.selected).then(()=>openReview(app.selected)).catch(()=>notify('Nu am putut încărca fotografiile.'));
   return;
  }
  if(action.startsWith('review-')||action.startsWith('mask-')){reviewAction(action);return}
  if(action==='start'){
   if(app.mode==='judge'&&(!app.conns.A?.open||!app.conns.B?.open)){notify('Așteaptă ambii concurenți.');return}
   const btn=el;btn.disabled=true;btn.textContent='Se pregătesc fotografiile…';
   startPhotoLoad(app.selected).then(()=>{
    if(automaticCards(app.selected).length<2){btn.disabled=false;btn.textContent='▶ Începe duelul';notify('Nu sunt suficiente imagini disponibile pentru această categorie.');return}
    beginGame();
   }).catch(()=>{btn.disabled=false;btn.textContent='▶ Începe duelul';notify('Nu am putut încărca imaginile. Încearcă din nou.')});
   return;
  }
  if(action==='bad-photo'){const g=app.game;if(!g||g.phase!=='playing'||g.passRemainingMs)return;banCard(g.categoryId,g.card);delete approvedPhotos[approvedKey(g.categoryId,g.card)];saveReview();g.deck=g.deck.filter(x=>!rejected[g.categoryId].includes(x.wiki));nextCard(g);render(true);broadcast();return}if(action==='correct'||action==='wrong'){applyCommand(action);return}if(action==='pass'){if(app.mode==='player'){if(app.remote?.phase==='playing'&&app.remote.active===app.role&&app.connection?.open)app.connection.send({type:'action',action:'pass'});return}applyCommand('pass');return}if(action==='reveal'){app.showAnswer=!app.showAnswer;render(true);return}if(action==='toggle-pause'){if(!app.game)return;const g=app.game;if(g.phase==='playing'){g.phase='paused'}else if(g.phase==='paused'){g.phase='playing';g.lastAt=performance.now();screenAwake()}render(true);broadcast();return}if(action==='end'){if(!app.game)return;finishGame(app.game.clocks.A>=app.game.clocks.B?'B':'A',true);return}if(action==='again'){app.blurAdjust=false;app.blurAdjustWasPlaying=false;app.game=null;app.screen='setup';app.showAnswer=false;render(true);broadcast();startPhotoLoad(app.selected);return}}
document.addEventListener('click',e=>{
 const liveFrame=e.target.closest('.photo .image-frame');
 if(liveFrame&&app.blurAdjust&&app.mode!=='player'&&app.game?.card){
  const g=app.game,rect=liveFrame.getBoundingClientRect(),masks=normalizedMasks(g.card.masks);
  if(!masks.length)masks.push({x:20,y:15,w:60,h:22});
  const m=masks[masks.length-1],cx=(e.clientX-rect.left)/rect.width*100,cy=(e.clientY-rect.top)/rect.height*100;
  m.x=Math.max(0,Math.min(100-m.w,cx-m.w/2));m.y=Math.max(0,Math.min(100-m.h,cy-m.h/2));
  g.card.masks=normalizedMasks(masks);persistCurrentMasks();render(true);broadcast();return;
 }
 const reviewImage=e.target.closest('.review-stage .image-frame');
 if(reviewImage&&app.screen==='review'&&app.review){
  const r=app.review;
  if(r.selected<0){notify('Apasă mai întâi „+ Adaugă blur”.');return}
  const bounds=reviewImage.getBoundingClientRect();
  const m=r.masks[r.selected];
  if(m&&bounds.width>0&&bounds.height>0){
   const cx=(e.clientX-bounds.left)/bounds.width*100,cy=(e.clientY-bounds.top)/bounds.height*100;
   m.x=Math.max(0,Math.min(100-m.w,cx-m.w/2));m.y=Math.max(0,Math.min(100-m.h,cy-m.h/2));
   render(true);
  }return;
 }
 const el=e.target.closest('button[data-action]');if(el&&!el.disabled)handleAction(el.dataset.action,el);
});
document.addEventListener('input',e=>{const field=e.target.dataset.field;if(field==='name-a')app.names.A=e.target.value.trim()||'Jucătorul 1';if(field==='name-b')app.names.B=e.target.value.trim()||'Jucătorul 2';if(field==='cat-search'){app.catFilter=e.target.value;const q=e.target.value.toLocaleLowerCase('ro').normalize('NFD').replace(/[\u0300-\u036f]/g,'');for(const el of document.querySelectorAll('.cat')){const label=el.textContent.toLocaleLowerCase('ro').normalize('NFD').replace(/[\u0300-\u036f]/g,'');el.style.display=label.includes(q)?'':'none'}}if(field==='join-name')app.joinName=e.target.value;if(field==='join-code')app.room=e.target.value.toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,6)});
document.addEventListener('change',e=>{if(e.target.dataset.field==='limit')app.limit=Number(e.target.value)});
const initialRoom=new URLSearchParams(location.search).get('room');if(initialRoom&&/^[A-HJ-NP-Z2-9]{6}$/i.test(initialRoom)){app.mode='player';app.screen='join';app.room=initialRoom.toUpperCase()}
render(true);
})();
</script>
